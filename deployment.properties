# IcedTea-Web settings for vendor BMC KVM viewers.
# Vendor jars are commonly unsigned or signed with expired certificates.
deployment.security.level=ALLOW_UNSIGNED
deployment.manifest.attributes.check=NONE
deployment.security.askgrantdialog.notinca=false
deployment.security.notinca.warning=false
deployment.security.expired.warning=false
deployment.security.jsse.hostmismatch.warning=false
deployment.security.https.warning.show=false
deployment.console.startup.mode=DISABLE
