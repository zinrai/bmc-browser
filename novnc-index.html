<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bmc-browser</title>
<!--
  noVNC defaults to resize=off, which clips the session to the browser window,
  and to autoconnect=false, which asks the user to press Connect first. Xvnc
  can resize its framebuffer, so hand it the window size instead of clipping.
-->
<meta http-equiv="refresh" content="0; url=vnc.html?resize=remote&amp;autoconnect=true">
</head>
<body>
<p><a href="vnc.html?resize=remote&amp;autoconnect=true">Open the console</a></p>
</body>
</html>
